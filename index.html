<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <button id="themeToggle">🌙Dark Mode</button>

        <div class="header">
            <p class="subtitle">Stay organized. Get things done.</p>
            <h1>To-Do List</h1>
        </div>

        <div class="input-section">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter your task..."
            >

            <input
                type="date"
                id="dueDate"
            >

            <select id="priority">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
            </select>

            <button id="addButton">Add Task</button>

        </div>

        <div class="filter-section">

            <input
                type="text"
                id="searchInput"
                placeholder="🔍 Search tasks..."
            >

            <div class="filter-buttons">
                <button id="allButton">All</button>
                <button id="activeButton">Active</button>
                <button id="completedButton">Completed</button>
            </div>

        </div>

        <div class="dashboard">

            <div class="stat-card">
                <h2 id="totalTasks">0</h2>
                <p>Total</p>
            </div>

            <div class="stat-card">
                <h2 id="completedTasks">0</h2>
                <p>Completed</p>
            </div>

            <div class="stat-card">
                <h2 id="remainingTasks">0</h2>
                <p>Remaining</p>
            </div>

        </div>

        <ul id="taskList"></ul>

        <p id="taskCount">0 tasks remaining</p>

    </div>

    <script src="script.js"></script>

</body>
</html>
